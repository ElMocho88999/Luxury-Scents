<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Interactivo & Panel Administrativo</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
            --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-primary); padding-bottom: 60px; overflow-x: hidden; }

        header {
            background-color: var(--bg-card);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        
        /* Animaciones y fluidez para Grid / List */
        .grid-layout { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 1.5rem; 
            transition: all 0.5s var(--transition-smooth);
        }
        .list-layout { 
            display: flex; 
            flex-direction: column; 
            gap: 1.2rem; 
            transition: all 0.5s var(--transition-smooth);
        }

        /* Tarjeta con animaciones táctiles atractivas */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.3s var(--transition-bounce), box-shadow 0.3s var(--transition-smooth), border-color 0.3s ease;
            animation: fadeIn 0.4s ease-out forwards;
        }

        .card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 12px 25px rgba(245, 158, 11, 0.15);
            border-color: rgba(245, 158, 11, 0.4);
        }

        .card img { 
            width: 100%; 
            height: 200px; 
            object-fit: cover; 
            transition: transform 0.5s var(--transition-smooth);
        }
        .card:hover img {
            transform: scale(1.05);
        }

        .card-body { padding: 1.2rem; flex: 1; display: flex; flex-direction: column; gap: 0.5rem; }
        
        .badge-offer { background: var(--accent-red); color: white; padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
        .badge-new { background: var(--accent-green); color: white; padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }

        /* Botones estéticos con efectos de pulsación */
        .btn-gold { 
            background: linear-gradient(135deg, #f59e0b, #d97706); 
            color: #000; 
            border: none; 
            padding: 0.6rem 1.2rem; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: transform 0.2s var(--transition-bounce), box-shadow 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(245, 158, 11, 0.4);
        }
        .btn-gold:active {
            transform: translateY(0) scale(0.96);
        }

        /* Botón de Comprar con Emoji de Dinero 💸 */
        .btn-buy {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 0.7rem 1rem;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.25s var(--transition-bounce);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }
        .btn-buy:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }
        .btn-buy:active {
            transform: translateY(0) scale(0.96);
        }
        .btn-buy .money-icon {
            display: inline-block;
            transition: transform 0.3s var(--transition-bounce);
        }
        .btn-buy:hover .money-icon {
            transform: rotate(-12deg) scale(1.3);
        }

        .btn-secondary { background-color: var(--border-color); color: var(--text-primary); border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .btn-secondary:hover { background-color: #475569; }
        
        .btn-danger { background-color: var(--accent-red); color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; transition: opacity 0.2s; }
        .btn-danger:hover { opacity: 0.9; }

        .admin-panel { 
            display: none; 
            background: var(--bg-card); 
            border: 1px solid var(--border-color); 
            border-radius: 14px; 
            padding: 1.8rem; 
            margin-top: 2rem;
            animation: slideDown 0.4s var(--transition-bounce);
        }
        .admin-panel.active { display: block; }

        .subvariant-row { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; align-items: center; }
        .subvariant-row input { background: var(--bg-primary); border: 1px solid var(--border-color); color: white; padding: 0.5rem; border-radius: 6px; }

        .admin-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; border-bottom: 1px solid var(--border-color); transition: background 0.2s; }
        .admin-item:hover { background: rgba(255,255,255,0.02); }
        .admin-item-controls { display: flex; gap: 0.5rem; }

        .order-badge { padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
        .badge-paid { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); }
        .badge-pending { background: rgba(245, 158, 11, 0.2); color: var(--accent-gold); }

        .modal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.8); 
            backdrop-filter: blur(4px);
            justify-content: center; 
            align-items: center; 
            z-index: 1000;
        }
        .modal.active { display: flex; animation: fadeIn 0.3s ease-out; }
        .modal-content { 
            background: var(--bg-card); 
            padding: 2rem; 
            border-radius: 14px; 
            width: 90%; 
            max-width: 500px; 
            max-height: 90vh; 
            overflow-y: auto; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: scaleUp 0.3s var(--transition-bounce);
        }

        /* Keyframes de Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <header>
        <h2>📦 Mi Catálogo</h2>
        <button class="btn-gold" onclick="openAdminAuth()">🔑 Panel Admin</button>
    </header>

    <div class="container">
        <div id="catalog-container" class="grid-layout"></div>

        <!-- Panel de Administración -->
        <div id="admin-panel" class="admin-panel">
            <h3>⚙️ Panel de Control Administrativo</h3>
            <br>
            
            <!-- Configuración de Diseño / Orientación (Punto 2) -->
            <section style="margin-bottom: 2rem;">
                <h4>Layout y Orientación del Catálogo</h4>
                <div style="display: flex; gap: 1rem; align-items: center; margin-top: 0.5rem;">
                    <select id="cfg-layout-mode" class="subvariant-row" style="padding: 0.5rem; width: 220px;">
                        <option value="grid">Grid (Horizontal / Mosaico)</option>
                        <option value="list">Lista (Vertical / Filas)</option>
                    </select>
                    <button class="btn-gold" onclick="saveLayoutConfig()">Guardar Orientación</button>
                </div>
            </section>

            <!-- Agregar Producto / Perfume con Subtítulo (Punto 2) -->
            <section style="margin-bottom: 2rem;">
                <h4>Añadir Nuevo Perfume / Producto</h4>
                <div style="display: grid; gap: 0.5rem; max-width: 400px; margin-top: 0.5rem;">
                    <input type="text" id="new-name" placeholder="Nombre del perfume o producto" class="subvariant-row">
                    <!-- Opción agregada para Subtítulo -->
                    <input type="text" id="new-subtitle" placeholder="Subtítulo (ej. Eau de Parfum / 100ml)" class="subvariant-row">
                    <input type="number" id="new-price" placeholder="Precio Base ($)" class="subvariant-row">
                    <input type="number" id="new-initial" placeholder="Inicial para Cuotas ($)" class="subvariant-row">
                    <textarea id="new-note" placeholder="Nota / Descripción detallada" class="subvariant-row"></textarea>
                    
                    <label><input type="checkbox" id="new-is-new"> Marcar como Nuevo Perfume</label>
                    <label><input type="checkbox" id="new-is-offer" onchange="document.getElementById('new-offer-box').style.display = this.checked ? 'block' : 'none'"> Tiene Oferta</label>

                    <div id="new-offer-box" style="display:none;">
                        <input type="number" id="new-offer-price" placeholder="Precio Oferta ($)" class="subvariant-row">
                        <input type="date" id="new-offer-until" class="subvariant-row">
                    </div>

                    <input type="file" id="new-img-file" accept="image/*" onchange="handleImageUpload(event, 'new-img-preview')">
                    <div id="new-img-preview" style="width:100px; height:100px; border:1px dashed var(--border-color); border-radius:8px; display:flex; align-items:center; justify-content:center; overflow:hidden;">Vista Previa</div>

                    <div id="subvariants-container"></div>
                    <button class="btn-secondary" onclick="addSubvariantField('subvariants-container')">+ Añadir Subvariante / Presentación</button>

                    <button class="btn-gold" style="margin-top: 1rem;" onclick="addNewProduct()">Guardar Perfume</button>
                </div>
            </section>

            <!-- Gestión de Inventario -->
            <section style="margin-bottom: 2rem;">
                <h4>Inventario Existente</h4>
                <div id="admin-price-list"></div>
            </section>

            <!-- Registro de Pedidos -->
            <section style="margin-bottom: 2rem;">
                <h4>Historial de Pedidos</h4>
                <div id="admin-orders-list"></div>
            </section>

            <!-- Configuración de Métodos de Pago y Cuotas -->
            <section style="margin-bottom: 2rem;">
                <h4>Configuración de Pagos</h4>
                <label><input type="checkbox" id="cfg-pay-pm"> Pago Móvil</label><br>
                <input type="text" id="cfg-pm-banco" placeholder="Banco" class="subvariant-row">
                <input type="text" id="cfg-pm-telf" placeholder="Teléfono" class="subvariant-row">
                <input type="text" id="cfg-pm-cedula" placeholder="Cédula/RIF" class="subvariant-row"><br>
                
                <label><input type="checkbox" id="cfg-pay-efectivo"> Efectivo</label><br>
                <label><input type="checkbox" id="cfg-pay-cuotas"> Financiamiento en Cuotas</label><br><br>

                <h5>Parámetros de Financiamiento</h5>
                <input type="number" id="cfg-num-cuotas" placeholder="Número de cuotas (ej. 4)" class="subvariant-row">
                <input type="text" id="cfg-frecuencia" placeholder="Frecuencia (ej. Quincenal)" class="subvariant-row"><br>

                <button class="btn-gold" onclick="savePayMethodsConfig(); saveCuotasConfig();">Guardar Pagos</button>
            </section>

            <!-- Seguridad -->
            <section>
                <h4>Cambiar PIN Administrativo</h4>
                <input type="password" id="new-pass-input" placeholder="Nuevo PIN (8 dígitos)" maxlength="8" class="subvariant-row">
                <button class="btn-danger" onclick="changePassword()">Actualizar PIN</button>
            </section>

            <br><br>
            <button class="btn-secondary" onclick="closeAdminPanel()">Cerrar Panel</button>
        </div>
    </div>

    <!-- Modal Editar Producto / Perfume -->
    <div id="edit-product-modal" class="modal">
        <div class="modal-content">
            <h3>Editar Perfume / Producto</h3>
            <input type="hidden" id="edit-prod-id">
            <input type="text" id="edit-name" placeholder="Nombre" class="subvariant-row">
            <!-- Campo de Subtítulo en Edición -->
            <input type="text" id="edit-subtitle" placeholder="Subtítulo" class="subvariant-row">
            <input type="number" id="edit-price" placeholder="Precio Base" class="subvariant-row">
            <input type="number" id="edit-initial" placeholder="Inicial" class="subvariant-row">
            <textarea id="edit-note" placeholder="Nota" class="subvariant-row"></textarea>
            
            <label><input type="checkbox" id="edit-is-new"> Marcar como Nuevo Perfume</label>
            <label><input type="checkbox" id="edit-is-offer" onchange="document.getElementById('edit-offer-box').style.display = this.checked ? 'block' : 'none'"> En Oferta</label>

            <div id="edit-offer-box" style="display:none;">
                <input type="number" id="edit-offer-price" placeholder="Precio Oferta" class="subvariant-row">
                <input type="date" id="edit-offer-until" class="subvariant-row">
            </div>

            <div id="edit-subvariants-container"></div>
            <button class="btn-secondary" onclick="addSubvariantField('edit-subvariants-container')">+ Añadir Subvariante</button>

            <div id="edit-img-preview" style="width:100px; height:100px; margin-top: 0.5rem; border-radius:8px; overflow:hidden;"></div>

            <div style="display:flex; gap:0.5rem; margin-top:1rem;">
                <button class="btn-gold" onclick="saveProductEdits()">Guardar Cambios</button>
                <button class="btn-secondary" onclick="closeEditModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, collection, onSnapshot, doc, setDoc, addDoc, updateDoc, deleteDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForTemplate-xxxxxx",
            authDomain: "tu-app.firebaseapp.com",
            projectId: "tu-app-id",
            storageBucket: "tu-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let products = [];
        let orders = [];
        let layoutConfig = { mode: 'grid' };
        let payConfig = {};
        let cuotasConfig = { numCuotas: 4, frecuencia: 'Quincenal' };
        let adminPass = "12345678";
        let tempBase64Image = "";

        // Suscripciones en tiempo real
        onSnapshot(collection(db, "products"), (snapshot) => {
            products = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            products.sort((a, b) => (a.order || 0) - (b.order || 0));
            renderCatalog();
            renderAdminInventory();
        });

        onSnapshot(collection(db, "orders"), (snapshot) => {
            orders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderAdminOrders();
        });

        onSnapshot(doc(db, "config", "layout"), (docSnap) => {
            if(docSnap.exists()) {
                layoutConfig = docSnap.data();
                renderCatalog();
            }
        });

        onSnapshot(doc(db, "config", "pay"), (docSnap) => {
            if(docSnap.exists()) payConfig = docSnap.data();
        });

        onSnapshot(doc(db, "config", "cuotas"), (docSnap) => {
            if(docSnap.exists()) cuotasConfig = docSnap.data();
        });

        onSnapshot(doc(db, "config", "security"), (docSnap) => {
            if(docSnap.exists()) adminPass = docSnap.data().pin || "12345678";
        });

        // Funciones asociadas a window
        window.handleImageUpload = function(event, previewId) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    tempBase64Image = e.target.result;
                    document.getElementById(previewId).innerHTML = `<img src="${tempBase64Image}" style="width:100%; height:100%; object-fit:cover;">`;
                };
                reader.readAsDataURL(file);
            }
        };

        window.addSubvariantField = function(containerId, name="", price="", initial="", isOffer=false, offerPrice="") {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = 'subvariant-row';
            div.innerHTML = `
                <input type="text" placeholder="Subvariante" class="sub-name" value="${name}" style="flex:2;">
                <input type="number" placeholder="Precio ($)" class="sub-price" value="${price}" style="flex:1;">
                <input type="number" placeholder="Inicial ($)" class="sub-initial" value="${initial}" style="flex:1;">
                <label style="font-size:0.75rem;"><input type="checkbox" class="sub-is-offer" ${isOffer ? 'checked' : ''}> Oferta</label>
                <input type="number" placeholder="P.Oferta" class="sub-offer-price" value="${offerPrice}" style="flex:1;">
                <button type="button" class="btn-danger" style="padding:2px 6px;" onclick="this.parentElement.remove()">X</button>
            `;
            container.appendChild(div);
        };

        function renderCatalog() {
            const container = document.getElementById('catalog-container');
            if(!container) return;

            // Transición suave entre layouts (Horizontal vs Vertical)
            container.className = layoutConfig.mode === 'list' ? 'list-layout' : 'grid-layout';
            container.innerHTML = '';

            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const mainPrice = p.isOffer ? p.offerPrice : p.price;

                card.innerHTML = `
                    <img src="${p.img || 'https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=400'}" alt="${p.name}">
                    <div class="card-body">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <div>
                                <h3 style="font-size: 1.15rem;">${p.name}</h3>
                                ${p.subtitle ? `<div style="color:var(--accent-gold); font-size:0.85rem; font-weight:600; margin-top:2px;">${p.subtitle}</div>` : ''}
                            </div>
                            <div style="display:flex; gap:4px;">
                                ${p.isNew ? '<span class="badge-new">Nuevo</span>' : ''}
                                ${p.isOffer ? '<span class="badge-offer">Oferta</span>' : ''}
                            </div>
                        </div>
                        <p style="color:var(--text-secondary); font-size:0.88rem; margin-top:4px;">${p.note || ''}</p>
                        <div style="margin-top:auto; padding-top:0.5rem;">
                            <div style="font-size:1.25rem; font-weight:bold; color:var(--accent-gold);">
                                $${parseFloat(mainPrice).toFixed(2)}
                                ${p.isOffer ? `<span style="text-decoration:line-through; color:var(--text-secondary); font-size:0.88rem; margin-left:8px;">$${parseFloat(p.price).toFixed(2)}</span>` : ''}
                            </div>
                            ${p.initialPay ? `<div style="font-size:0.8rem; color:var(--accent-green);">Inicial: $${parseFloat(p.initialPay).toFixed(2)}</div>` : ''}
                            
                            <!-- Botón de Comprar con Emoji Dinero 💸 y animación fluida -->
                            <button class="btn-buy" onclick="triggerPurchase('${p.name}', '${mainPrice}')">
                                Comprar <span class="money-icon">💸</span>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.triggerPurchase = function(name, price) {
            alert(`¡Gracias por tu interés en ${name} ($${price})! Tu pedido está siendo procesado.`);
        };

        window.openAdminAuth = function() {
            const input = prompt("Ingresa el PIN de seguridad de 8 dígitos:");
            if(input === adminPass) {
                document.getElementById('admin-panel').classList.add('active');
                populateAdminFields();
            } else if(input !== null) {
                alert("PIN incorrecto.");
            }
        };

        function populateAdminFields() {
            document.getElementById('cfg-layout-mode').value = layoutConfig.mode || 'grid';
            document.getElementById('cfg-pay-pm').checked = payConfig.pm;
            document.getElementById('cfg-pay-efectivo').checked = payConfig.efectivo;
            document.getElementById('cfg-pay-cuotas').checked = payConfig.cuotas;
            document.getElementById('cfg-pm-banco').value = payConfig.pmBanco || "";
            document.getElementById('cfg-pm-telf').value = payConfig.pmTelf || "";
            document.getElementById('cfg-pm-cedula').value = payConfig.pmCedula || "";

            document.getElementById('cfg-num-cuotas').value = cuotasConfig.numCuotas;
            document.getElementById('cfg-frecuencia').value = cuotasConfig.frecuencia;

            document.getElementById('subvariants-container').innerHTML = '';
        }

        window.closeAdminPanel = function() { document.getElementById('admin-panel').classList.remove('active'); };

        window.saveLayoutConfig = async function() {
            const mode = document.getElementById('cfg-layout-mode').value;
            await setDoc(doc(db, "config", "layout"), { mode });
            alert("Orientación del catálogo guardada exitosamente.");
        };

        window.addNewProduct = async function() {
            const name = document.getElementById('new-name').value.trim();
            const subtitle = document.getElementById('new-subtitle').value.trim();
            const price = parseFloat(document.getElementById('new-price').value) || 0;
            const initialPay = parseFloat(document.getElementById('new-initial').value) || 0;
            const note = document.getElementById('new-note').value.trim();
            const isNew = document.getElementById('new-is-new').checked;
            const isOffer = document.getElementById('new-is-offer').checked;
            const offerPrice = parseFloat(document.getElementById('new-offer-price').value) || 0;
            const offerUntil = document.getElementById('new-offer-until').value;

            if(!name || price <= 0) return alert("Ingresa un nombre y un precio válido.");

            const subRows = document.querySelectorAll('#subvariants-container .subvariant-row');
            const subvariants = [];
            subRows.forEach(row => {
                const sName = row.querySelector('.sub-name').value.trim();
                const sPrice = parseFloat(row.querySelector('.sub-price').value) || price;
                const sInitial = parseFloat(row.querySelector('.sub-initial').value) || initialPay;
                const sIsOffer = row.querySelector('.sub-is-offer').checked;
                const sOfferPrice = parseFloat(row.querySelector('.sub-offer-price').value) || 0;
                if(sName) {
                    subvariants.push({ name: sName, price: sPrice, initialPay: sInitial, isOffer: sIsOffer, offerPrice: sOfferPrice });
                }
            });

            const img = tempBase64Image || 'https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=400';

            await addDoc(collection(db, "products"), {
                name, subtitle, price, initialPay, note, isNew, isOffer, offerPrice, offerUntil,
                subvariants, img, order: products.length
            });

            document.getElementById('new-name').value = '';
            document.getElementById('new-subtitle').value = '';
            document.getElementById('new-price').value = '';
            document.getElementById('new-initial').value = '';
            document.getElementById('new-note').value = '';
            document.getElementById('new-is-new').checked = false;
            document.getElementById('new-is-offer').checked = false;
            document.getElementById('new-offer-price').value = '';
            document.getElementById('new-offer-until').value = '';
            document.getElementById('new-offer-box').style.display = 'none';
            document.getElementById('subvariants-container').innerHTML = '';
            document.getElementById('new-img-file').value = '';
            document.getElementById('new-img-preview').innerText = 'Vista Previa';
            tempBase64Image = "";

            alert("Perfume / Producto guardado exitosamente.");
        };

        function renderAdminInventory() {
            const container = document.getElementById('admin-price-list');
            if(!container) return;
            container.innerHTML = '';

            products.forEach((p, index) => {
                const row = document.createElement('div');
                row.className = 'admin-item';
                row.innerHTML = `
                    <div style="flex:1;">
                        <strong>${p.name}</strong> ${p.subtitle ? `<small style="color:var(--accent-gold);">(${p.subtitle})</small>` : ''} - $${parseFloat(p.price).toFixed(2)}
                        ${p.isOffer ? ` <span style="color:#ef4444; font-size:0.8rem;">(🔥 $${parseFloat(p.offerPrice || 0).toFixed(2)})</span>` : ''}
                    </div>
                    <div class="admin-item-controls">
                        <button class="btn-secondary" style="padding:4px 8px;" onclick="moveProductOrder(${index}, -1)">⬆️</button>
                        <button class="btn-secondary" style="padding:4px 8px;" onclick="moveProductOrder(${index}, 1)">⬇️</button>
                        <button class="btn-gold" style="padding:4px 8px; font-size:0.8rem;" onclick="openEditProductModal('${p.id}')">✏️ Editar</button>
                        <button class="btn-danger" style="padding:4px 8px; font-size:0.8rem;" onclick="deleteProduct('${p.id}')">🗑️</button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        window.moveProductOrder = async function(index, direction) {
            const targetIndex = index + direction;
            if(targetIndex < 0 || targetIndex >= products.length) return;

            const temp = products[index];
            products[index] = products[targetIndex];
            products[targetIndex] = temp;

            for(let i = 0; i < products.length; i++) {
                await updateDoc(doc(db, "products", products[i].id), { order: i });
            }
        };

        window.openEditProductModal = function(id) {
            const p = products.find(prod => prod.id === id);
            if(!p) return;

            document.getElementById('edit-prod-id').value = p.id;
            document.getElementById('edit-name').value = p.name;
            document.getElementById('edit-subtitle').value = p.subtitle || '';
            document.getElementById('edit-price').value = p.price;
            document.getElementById('edit-initial').value = p.initialPay || 0;
            document.getElementById('edit-note').value = p.note || '';
            document.getElementById('edit-is-new').checked = !!p.isNew;
            document.getElementById('edit-is-offer').checked = !!p.isOffer;
            document.getElementById('edit-offer-price').value = p.offerPrice || '';
            document.getElementById('edit-offer-until').value = p.offerUntil || '';
            document.getElementById('edit-offer-box').style.display = p.isOffer ? 'block' : 'none';

            const subContainer = document.getElementById('edit-subvariants-container');
            subContainer.innerHTML = '';
            if(p.subvariants && p.subvariants.length > 0) {
                p.subvariants.forEach(sv => {
                    addSubvariantField('edit-subvariants-container', sv.name, sv.price, sv.initialPay, sv.isOffer, sv.offerPrice);
                });
            }

            document.getElementById('edit-img-preview').innerHTML = p.img ? `<img src="${p.img}" style="width:100%; height:100%; object-fit:cover;">` : 'Vista Previa';
            tempBase64Image = p.img || "";

            document.getElementById('edit-product-modal').classList.add('active');
        };

        window.closeEditModal = function() {
            document.getElementById('edit-product-modal').classList.remove('active');
            tempBase64Image = "";
        };

        window.saveProductEdits = async function() {
            const id = document.getElementById('edit-prod-id').value;
            const name = document.getElementById('edit-name').value.trim();
            const subtitle = document.getElementById('edit-subtitle').value.trim();
            const price = parseFloat(document.getElementById('edit-price').value) || 0;
            const initialPay = parseFloat(document.getElementById('edit-initial').value) || 0;
            const note = document.getElementById('edit-note').value.trim();
            const isNew = document.getElementById('edit-is-new').checked;
            const isOffer = document.getElementById('edit-is-offer').checked;
            const offerPrice = parseFloat(document.getElementById('edit-offer-price').value) || 0;
            const offerUntil = document.getElementById('edit-offer-until').value;

            if(!name || price <= 0) return alert("Ingresa un nombre y precio válido.");

            const subRows = document.querySelectorAll('#edit-subvariants-container .subvariant-row');
            const subvariants = [];
            subRows.forEach(row => {
                const sName = row.querySelector('.sub-name').value.trim();
                const sPrice = parseFloat(row.querySelector('.sub-price').value) || price;
                const sInitial = parseFloat(row.querySelector('.sub-initial').value) || initialPay;
                const sIsOffer = row.querySelector('.sub-is-offer').checked;
                const sOfferPrice = parseFloat(row.querySelector('.sub-offer-price').value) || 0;
                if(sName) {
                    subvariants.push({ name: sName, price: sPrice, initialPay: sInitial, isOffer: sIsOffer, offerPrice: sOfferPrice });
                }
            });

            const updateData = {
                name, subtitle, price, initialPay, note, isNew, isOffer, offerPrice, offerUntil, subvariants
            };

            if(tempBase64Image) {
                updateData.img = tempBase64Image;
            }

            await updateDoc(doc(db, "products", id), updateData);
            closeEditModal();
            alert("Producto actualizado correctamente.");
        };

        window.deleteProduct = async function(id) {
            if(confirm("¿Seguro que deseas eliminar este producto?")) {
                await deleteDoc(doc(db, "products", id));
            }
        };

        function renderAdminOrders() {
            const container = document.getElementById('admin-orders-list');
            if(!container) return;
            container.innerHTML = '';

            orders.forEach(ord => {
                const badgeClass = ord.status === 'Pagado' ? 'badge-paid' : 'badge-pending';
                const row = document.createElement('div');
                row.className = 'admin-item';
                row.innerHTML = `
                    <div style="flex:1;">
                        <div><strong>${ord.clientName}</strong> - $${ord.totalPrice} <span class="order-badge ${badgeClass}">${ord.status}</span></div>
                        <div style="font-size:0.8rem; color:var(--text-secondary);">${ord.date} | ${ord.payMethod}</div>
                    </div>
                    <div class="admin-item-controls">
                        <button class="btn-secondary" style="padding:4px 8px; font-size:0.8rem;" onclick="toggleOrderStatus('${ord.id}', '${ord.status}')">Cambiar Estado</button>
                        <button class="btn-danger" style="padding:4px 8px; font-size:0.8rem;" onclick="deleteOrder('${ord.id}')">🗑️</button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        window.toggleOrderStatus = async function(id, currentStatus) {
            const nextStatus = currentStatus === 'Pagado' ? 'Pendiente' : 'Pagado';
            await updateDoc(doc(db, "orders", id), { status: nextStatus });
        };

        window.deleteOrder = async function(id) {
            if(confirm("¿Eliminar este registro de pedido?")) {
                await deleteDoc(doc(db, "orders", id));
            }
        };

        window.savePayMethodsConfig = async function() {
            const pm = document.getElementById('cfg-pay-pm').checked;
            const efectivo = document.getElementById('cfg-pay-efectivo').checked;
            const cuotas = document.getElementById('cfg-pay-cuotas').checked;
            const pmBanco = document.getElementById('cfg-pm-banco').value.trim();
            const pmTelf = document.getElementById('cfg-pm-telf').value.trim();
            const pmCedula = document.getElementById('cfg-pm-cedula').value.trim();

            await setDoc(doc(db, "config", "pay"), {
                pm, efectivo, cuotas, pmBanco, pmTelf, pmCedula
            });
            alert("Configuración de métodos de pago guardada.");
        };

        window.saveCuotasConfig = async function() {
            const numCuotas = parseInt(document.getElementById('cfg-num-cuotas').value) || 4;
            const frecuencia = document.getElementById('cfg-frecuencia').value.trim() || "Quincenal";

            await setDoc(doc(db, "config", "cuotas"), {
                numCuotas, frecuencia
            });
            alert("Parámetros de cuotas actualizados.");
        };

        window.changePassword = async function() {
            const pin = document.getElementById('new-pass-input').value.trim();
            if(pin.length !== 8 || isNaN(pin)) return alert("El PIN debe ser un número exacto de 8 dígitos.");

            await setDoc(doc(db, "config", "security"), { pin });
            adminPass = pin;
            document.getElementById('new-pass-input').value = '';
            alert("PIN administrativo actualizado.");
        };
    </script>
</body>
</html>
